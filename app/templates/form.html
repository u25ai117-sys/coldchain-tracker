{% extends "base.html" %}
{% block title %}{{ title }} - Cold Chain Tracker{% endblock %}
{% block content %}
<h3 class="mb-3">{{ title }}</h3>
<form method="post" action="{{ action }}" class="card card-body" style="max-width: 640px;">
  {% for f in fields %}
  <div class="mb-3">
    <label class="form-label">{{ f.label }}</label>
    {% if f.type == 'select' %}
    <select name="{{ f.name }}" class="form-select" {% if f.required %}required{% endif %}>
      {% if not f.required %}<option value="">(none)</option>{% endif %}
      {% for val, text in f.options %}
      <option value="{{ val }}" {% if item and (item[f.name]|string) == (val|string) %}selected{% endif %}>{{ text }}</option>
      {% endfor %}
    </select>
    {% else %}
    <input type="{{ f.type }}" name="{{ f.name }}" class="form-control"
           {% if f.step %}step="{{ f.step }}"{% endif %}
           value="{{ item[f.name] if item and item[f.name] is not none else '' }}" required>
    {% endif %}
  </div>
  {% endfor %}
  <div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ cancel }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
